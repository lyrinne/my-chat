<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的AI助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .header-info h1 { font-size: 18px; font-weight: 600; }
        .header-info p { font-size: 12px; opacity: 0.8; }

        .settings-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        .settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 100;
            display: none;
            width: 340px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .settings-panel.show { display: block; animation: slideDown 0.3s ease; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-panel h3 { font-size: 16px; margin-bottom: 16px; color: #333; }
        .settings-section { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #eee; }
        .settings-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .settings-section h4 { font-size: 14px; color: #666; margin-bottom: 10px; }

        .name-input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            margin-bottom: 8px;
        }

        .name-btn {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .css-editor {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: vertical;
            outline: none;
            background: #f8f9fa;
        }

        .css-actions { display: flex; gap: 8px; margin-top: 8px; }
        .css-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .apply-btn { background: #667eea; color: white; }
        .clear-btn { background: #f5f5f5; color: #666; }

        .upload-btn {
            width: 100%;
            padding: 10px;
            background: #f5f5f5;
            border: 2px dashed #ddd;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 8px;
        }

        .reset-btn {
            width: 100%;
            padding: 10px;
            background: #f5f5f5;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: #666;
            font-size: 13px;
            margin-top: 8px;
        }

        .bg-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .bg-option { width: 100%; height: 50px; border-radius: 12px; cursor: pointer; border: 3px solid transparent; position: relative; overflow: hidden; }
        .bg-option span { position: absolute; bottom: 3px; left: 5px; font-size: 9px; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

        .avatar-options { display: flex; gap: 8px; flex-wrap: wrap; }
        .avatar-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #f5f5f5;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: transparent;
        }

        .message {
            display: flex;
            gap: 8px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
            align-items: flex-end;
            min-width: 0;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .message-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .message-content {
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            max-width: 100%;
            min-width: 0;
        }

        .message.ai .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-top-left-radius: 4px;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-top-right-radius: 4px;
        }

        .message-time {
            font-size: 10px;
            color: #999;
            flex-shrink: 0;
            margin: 0 2px;
        }

        .message.user .message-time { order: -1; }

        .message-sticker { padding: 5px !important; background: transparent !important; border: none !important; }
        .message-sticker img { width: 100px; height: 100px; object-fit: contain; display: block; }

       .red-packet {
    background: #f45b5b !important;
    color: white !important;
    border: none !important;
    padding: 8px 14px !important;
    min-width: 180px !important;
    max-width: 220px !important;
    text-align: center !important;
    cursor: pointer !important;
    border-radius: 10px !important;
}
.red-packet .packet-title { font-size: 12px !important; line-height: 1.3 !important; }
.red-packet .packet-amount { font-size: 16px !important; font-weight: 600 !important; margin: 2px 0 !important; }
.red-packet .packet-note { display: none !important; }

       .transfer-card {
    background: #fff !important;
    border: 1px solid #e8e8e8 !important;
    color: #333 !important;
    padding: 8px 14px !important;
    min-width: 180px !important;
    max-width: 220px !important;
    text-align: center !important;
    border-radius: 10px !important;
}
.transfer-card .transfer-icon {
    font-size: 15px !important;
    margin: 0 !important;
    display: block !important;
    line-height: 1.2 !important;
}
.transfer-card .transfer-amount {
    font-size: 16px !important;
    font-weight: 600 !important;
    color: #333 !important;
    display: block !important;
    line-height: 1.3 !important;
}
.transfer-card .transfer-status {
    font-size: 10px !important;
    color: #999 !important;
    margin-top: 2px !important;
    display: block !important;
    line-height: 1.2 !important;
}

        .sticker-panel {
            display: none;
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-height: 200px;
            overflow-y: auto;
        }

        .sticker-panel.show { display: flex; }

        .sticker-item { font-size: 40px; cursor: pointer; transition: all 0.2s; padding: 5px; position: relative; }
        .sticker-item:hover { transform: scale(1.2); }
        .sticker-item img { width: 50px; height: 50px; object-fit: contain; border-radius: 8px; }

        .sticker-item .delete-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 18px;
            height: 18px;
            background: #ff4444;
            color: white;
            border-radius: 50%;
            font-size: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .sticker-item:hover .delete-btn { display: flex; }

        .toolbar {
            display: flex;
            gap: 8px;
            padding: 8px 24px;
            background: white;
            border-top: 1px solid #eee;
        }

        .toolbar-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 20px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .toolbar-btn:hover { background: #f5f5f5; transform: scale(1.1); }

        .input-area {
            padding: 0 24px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
        }

        .input-area input:focus { border-color: #667eea; }

        .input-area button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; }
        .typing-dot { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: typing 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

        .poke-message {
            text-align: center;
            font-size: 11px;
            color: #999;
            padding: 4px 0;
            animation: fadeIn 0.3s ease;
        }

        .msg-menu {
            position: absolute;
            top: -10px;
            right: 10px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            z-index: 50;
            display: flex;
            overflow: hidden;
        }

        .msg-menu-item {
            padding: 8px 14px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            white-space: nowrap;
        }

        .msg-menu-item:active { background: #f0f0f0; }
        .msg-menu-del { color: #e53935; }

        .quote-block {
            background: rgba(0, 0, 0, 0.06);
            border-left: 3px solid rgba(0, 0, 0, 0.2);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 6px;
            opacity: 0.85;
            word-break: break-all;
            white-space: pre-wrap;
        }

        @media (max-width: 600px) {
            .container { width: 100%; height: 100vh; border-radius: 0; }
            .message { max-width: 90%; }
        }
.voice-bubble {

.voice-bubble .voice-duration {

.voice-bubble .voice-text {

.input-area {

}
    </style>
    <style id="customStyle"></style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar" id="headerAvatar">🤖</div>
            <div class="header-info">
                <h1 id="headerName">AI 助手</h1>
                <p>● 在线</p>
            </div>
            <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
        </div>

        <div class="settings-panel" id="settingsPanel">
            <h3>个性化设置</h3>

            <div class="settings-section">
                <h4>✏️ 修改名字</h4>
                <input class="name-input" id="aiNameInput" placeholder="AI的名字">
                <button class="name-btn" onclick="changeAIName()">保存AI名字</button>
                <input class="name-input" id="userNameInput" placeholder="你的名字">
                <button class="name-btn" onclick="changeUserName()">保存我的名字</button>
            </div>

            <div class="settings-section">
                <h4>👋 拍一拍后缀</h4>
                <input class="name-input" id="pokeAISuffixInput" placeholder="你拍他的后缀，如：的屁股">
                <button class="name-btn" onclick="setPokeAISuffix()">保存你拍他的后缀</button>
                <input class="name-input" id="pokeUserSuffixInput" placeholder="他拍你的后缀，如：的脸">
                <button class="name-btn" onclick="setPokeUserSuffix()">保存他拍你的后缀</button>
            </div>

            <div class="settings-section">
                <h4>🌙 夜间模式</h4>
                <button class="name-btn" onclick="toggleNightMode()">切换夜间模式</button>
            </div>

            <div class="settings-section">
                <h4>🎨 自定义CSS</h4>
                <textarea class="css-editor" id="cssEditor" placeholder="粘贴CSS代码..."></textarea>
                <div class="css-actions">
                    <button class="css-btn apply-btn" onclick="applyCSS()">应用</button>
                    <button class="css-btn clear-btn" onclick="clearCSS()">清空</button>
                </div>
            </div>

            <div class="settings-section">
                <h4>🤖 AI 头像</h4>
                <div class="avatar-options">
                    <div class="avatar-option" onclick="changeAvatar('🤖')">🤖</div>
                    <div class="avatar-option" onclick="changeAvatar('🦊')">🦊</div>
                    <div class="avatar-option" onclick="changeAvatar('🐱')">🐱</div>
                    <div class="avatar-option" onclick="changeAvatar('🐶')">🐶</div>
                    <div class="avatar-option" onclick="changeAvatar('🐼')">🐼</div>
                    <div class="avatar-option" onclick="changeAvatar('🦄')">🦄</div>
                </div>
                <button class="upload-btn" onclick="document.getElementById('avatarInput').click()">📁 上传头像</button>
                <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
            </div>

            <div class="settings-section">
                <h4>👤 我的头像</h4>
                <div class="avatar-options">
                    <div class="avatar-option" onclick="changeUserAvatar('👤')">👤</div>
                    <div class="avatar-option" onclick="changeUserAvatar('😊')">😊</div>
                    <div class="avatar-option" onclick="changeUserAvatar('😎')">😎</div>
                    <div class="avatar-option" onclick="changeUserAvatar('🥰')">🥰</div>
                    <div class="avatar-option" onclick="changeUserAvatar('🤓')">🤓</div>
                    <div class="avatar-option" onclick="changeUserAvatar('🐻')">🐻</div>
                </div>
                <button class="upload-btn" onclick="document.getElementById('userAvatarInput').click()">📁 上传头像</button>
                <input type="file" id="userAvatarInput" accept="image/*" style="display:none" onchange="uploadUserAvatar(event)">
            </div>

            <div class="settings-section">
                <h4>🖼️ 背景</h4>
                <div class="bg-options">
                    <div class="bg-option" style="background: linear-gradient(135deg, #667eea, #764ba2);" onclick="changeBg('gradient1')"><span>紫色</span></div>
                    <div class="bg-option" style="background: linear-gradient(135deg, #f093fb, #f5576c);" onclick="changeBg('gradient2')"><span>粉色</span></div>
                    <div class="bg-option" style="background: linear-gradient(135deg, #4facfe, #00f2fe);" onclick="changeBg('gradient3')"><span>蓝色</span></div>

            <span class="sticker-item" onclick="sendSticker('🐱')">🐱</span>
            <span class="sticker-item" onclick="sendSticker('🌈')">🌈</span>

            <div id="customStickers" style="display:contents;"></div>

        </div>

        <div class="toolbar">
            <button class="toolbar-btn" onclick="toggleStickerPanel()">〇</button>
            <button class="toolbar-btn" onclick="sendRedPacket()">￥</button>
            <button class="toolbar-btn" onclick="sendTransfer()">⇋</button>
        </div>

        <div class="input-area">
            <textarea id="userInput" placeholder="输入消息..." rows="1" onkeypress="handleKeyPress(event)"></textarea>
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const API_KEY = 'sk-J3UbNLkc7GruSOoA4aIwBVhNsXGQeVqk0EZB2fmjnpw0bg7m';
        let conversationHistory = [];
        let aiAvatar = '🤖';
        let userAvatar = '👤';
        let aiName = 'AI 助手';
        let userName = '我';
        let pokeAISuffix = '的屁股';
        let pokeUserSuffix = '的脸';

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('show');
        }

        document.addEventListener('click', function(e) {
            const panel = document.getElementById('settingsPanel');
            const btn = document.querySelector('.settings-btn');
            if (!panel.contains(e.target) && !btn.contains(e.target)) {
                panel.classList.remove('show');
            }
        });

        function toggleStickerPanel() {
            document.getElementById('stickerPanel').classList.toggle('show');
        }

        function toggleNightMode() {
            document.body.classList.toggle('night-mode');
            if (document.body.classList.contains('night-mode')) {
                localStorage.setItem('nightMode', 'on');
            } else {
                localStorage.setItem('nightMode', 'off');
            }

                gradient3: 'linear-gradient(135deg, #4facfe, #00f2fe)',

        function uploadBg(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > maxSize || height > maxSize) {
                        if (width > height) {
                            height = Math.round(height * (maxSize / width));
                            width = maxSize;
                        } else {
                            width = Math.round(width * (maxSize / height));
                            height = maxSize;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressed = canvas.toDataURL('image/jpeg', 0.6);
                    document.body.style.background = 'url(' + compressed + ')';
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundPosition = 'center';
                    document.body.style.backgroundImage = 'url(' + compressed + ')';
                    localStorage.setItem('chatBg', compressed);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const quoteText = input.dataset.quote || '';

            const parts = message.split(/\n|(?<=[。！？!?；;])/).map(s => s.trim()).filter(s => s);

            for (let i = 0; i < parts.length; i++) {
                if (i === 0 && quoteText) {
                    addMessage(parts[i], 'user', quoteText);
                    conversationHistory.push({ role: 'user', content: '我回复你：“' + quoteText + '”，然后说：' + parts[i] });
                } else {
                    addMessage(parts[i], 'user');
                    conversationHistory.push({ role: 'user', content: parts[i] });
                }
                await new Promise(resolve => setTimeout(resolve, 400));
            }

            delete input.dataset.quote;
            input.placeholder = '输入消息...';
            input.value = '';
            saveHistory();

            const typingId = showTyping();

            try {
                const response = await fetch('https://api.moonshot.cn/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'kimi-k2.7-code',
                        messages: [
    {
        role: 'system',
        content: '你想给对方转钱或发红包时，直接说“给你转账520”或“给你发红包13.14”，必须带金额。'
    },
    ...conversationHistory
],
                        temperature: 1,
                        max_tokens: 2000
                    })
                });

                const data = await response.json();
                hideTyping(typingId);

                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    if (reply && reply.trim()) {
                        conversationHistory.push({ role: 'assistant', content: reply });
                    }
                    saveHistory();

                    const sentences = reply
                        .split(/\n|(?<=[。！？!?；;])/)
                        .map(s => s.trim())
                        .filter(s => s.length > 0);

                    for (let i = 0; i < sentences.length; i++) {
    await new Promise(resolve => setTimeout(resolve, i === 0 ? 0 : 600));

    const text = sentences[i];

    const transferMatch = text.match(/转账.*?(\d+(?:\.\d+)?)/) || text.match(/(\d+(?:\.\d+)?).*?转账/);
    const packetMatch = text.match(/红包.*?(\d+(?:\.\d+)?)/) || text.match(/(\d+(?:\.\d+)?).*?红包/);

    if (transferMatch && text.includes('转账')) {
        addTransferFromAI(transferMatch[1]);
    } else if (packetMatch && text.includes('红包')) {
        addRedPacketFromAI(packetMatch[1]);
    } else if (Math.random() < 0.5) {
        addVoiceMessage(text, 'ai');
    } else {
        addMessage(text, 'ai');
    }
}
                } else {
                    addMessage('出错了：' + JSON.stringify(data), 'ai');
                }
            } catch (error) {
                hideTyping(typingId);
                addMessage('网络错误：' + error.message, 'ai');
            }
        }

    content.className = 'message-content red-packet';
    content.innerHTML = `
        <div class="packet-title">🧧 恭喜发财，大吉大利</div>
        <div class="packet-amount">¥${amount}</div>
        <div class="packet-note">点击领取（虚拟红包）</div>
    `;
    content.onclick = function() {
        if (!this.classList.contains('opened')) {
            this.classList.add('opened');
            this.innerHTML = `<div style="font-size:30px;">🎉</div><div style="font-size:14px;margin-top:5px;">已被领取</div>`;
            saveHistory();
        }
    };

    const time = document.createElement('div');
    time.className = 'message-time';
    time.textContent = getTime();

    messageDiv.appendChild(avatar);
    messageDiv.appendChild(content);
    messageDiv.appendChild(time);
    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    saveHistory();
    addDeleteEvents();
}

function showTyping() {
    const messagesDiv = document.getElementById('messages');
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message ai';
    typingDiv.id = 'typing-' + Date.now();

    const avatarHtml = aiAvatar.startsWith('data:image')
