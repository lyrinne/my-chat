<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的AI</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f6f8;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

.page {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
}

.page.active {
    display: flex;
}

/* 底部导航 */
.tabbar {
    display: flex;
    background: #fff;
    border-top: 1px solid #eee;
    padding: 8px 0;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
}

.tabbar-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 11px;
    color: #999;
    cursor: pointer;
    padding: 6px 0;
    transition: color 0.2s;
}

.tabbar-item.active {
    color: #667eea;
}

.tabbar-item .tab-icon {
    font-size: 22px;
    line-height: 1;
}

/* 聊天页内部 */
.chat-header {
    background: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    border-bottom: 1px solid #eee;
    flex-shrink: 0;
}

.chat-header .header-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    overflow: hidden;
}

.chat-header .header-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.chat-header .header-info h1 {
    font-size: 16px;
    font-weight: 600;
    color: #333;
}

.chat-header .header-info p {
    font-size: 11px;
    color: #999;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #f5f6f8;
}

/* 消息气泡 */
.message {
    display: flex;
    gap: 6px;
    max-width: 85%;
    align-items: flex-end;
    min-width: 0;
    position: relative;
}

.message.user {
    align-self: flex-end;
    flex-direction: row-reverse;
}

.message-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    overflow: hidden;
    background: #f0f0f0;
}

.message-avatar img { width: 100%; height: 100%; object-fit: cover; }

.message-content {
    padding: 8px 12px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14px;
    word-break: break-word;
    white-space: pre-wrap;
    max-width: 100%;
    min-width: 0;
}

.message.ai .message-content {
    background: #fff;
    color: #333;
    border-top-left-radius: 4px;
}

.message.user .message-content {
    background: #667eea;
    color: #fff;
    border-top-right-radius: 4px;
}

.message-time {
    font-size: 10px;
    color: #bbb;
    flex-shrink: 0;
    margin: 0 2px;
    align-self: flex-end;
    padding-bottom: 2px;
}

/* 工具栏 + 输入 */
.toolbar {
    display: flex;
    gap: 8px;
    padding: 6px 12px;
    background: #fff;
    border-top: 1px solid #eee;
    flex-shrink: 0;
}

.toolbar-btn {
    width: 32px;
    height: 32px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 18px;
    border-radius: 50%;
    color: #666;
}

.input-area {
    padding: 8px 12px 12px;
    background: #fff;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
}

.input-area textarea {
    flex: 1;
    padding: 10px 16px;
    border: 1.5px solid #e5e5e5;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
    resize: none;
    font-family: inherit;
    line-height: 1.4;
    max-height: 100px;
    background: #f7f7f7;
    color: #333;
}

.input-area button {
    padding: 10px 20px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
}

/* 朋友圈页 */
.moments-header {
    background: #fff;
    padding: 14px 16px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    border-bottom: 1px solid #eee;
    flex-shrink: 0;
}

.moments-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    background: #f5f6f8;
}

.moment-item {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
}

.moment-head {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 8px;
}

.moment-avatar {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    overflow: hidden;
}

.moment-avatar img { width: 100%; height: 100%; object-fit: cover; }

.moment-name {
    font-size: 14px;
    font-weight: 600;
    color: #333;
}

.moment-time {
    font-size: 11px;
    color: #999;
}

.moment-text {
    font-size: 14px;
    color: #333;
    line-height: 1.5;
    margin-bottom: 8px;
}

.moment-actions {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: #666;
    padding-top: 8px;
    border-top: 1px solid #f0f0f0;
}

.moment-actions span {
    cursor: pointer;
}

/* 设置页 */
.settings-page {
    flex: 1;
    overflow-y: auto;
    background: #f5f6f8;
    padding: 12px;
}

.settings-section {
    background: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
}

.settings-section h4 {
    font-size: 13px;
    color: #666;
    margin-bottom: 10px;
}

.settings-page input,
.settings-page textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #e5e5e5;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    margin-bottom: 8px;
    font-family: inherit;
    background: #fafafa;
}

.settings-page textarea {
    height: 100px;
    resize: vertical;
}

.settings-page button {
    width: 100%;
    padding: 10px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
}

/* 隐藏多余旧元素 */
.sticker-panel,
.settings-panel {
    display: none !important;
}
</style>
</head>
<body>
<div class="app">

    <!-- 聊天页 -->
    <div class="page active" id="page-chat">
        <div class="chat-header">
            <div class="header-avatar" id="headerAvatar">🤖</div>
            <div class="header-info">
                <h1 id="headerName">AI 助手</h1>
                <p>● 在线</p>
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="message ai">
                <div class="message-avatar">🤖</div>
                <div class="message-content">你好，长按消息有菜单</div>
                <div class="message-time">00:00</div>
            </div>
        </div>

        <div class="toolbar">
            <button class="toolbar-btn" onclick="toggleStickerPanel()">〇</button>
            <button class="toolbar-btn" onclick="sendRedPacket()">￥</button>
            <button class="toolbar-btn" onclick="sendTransfer()">⇋</button>
            <button class="toolbar-btn" onclick="startCall('voice')">✆</button>
            <button class="toolbar-btn" onclick="startCall('video')">⊕</button>
        </div>

        <div class="input-area">
            <textarea id="userInput" placeholder="输入消息..." rows="1"></textarea>
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <!-- 朋友圈页 -->
    <div class="page" id="page-moments">
        <div class="moments-header">
    朋友圈
    <button onclick="generateMoment()" style="float:right;background:none;border:none;font-size:14px;color:#667eea;cursor:pointer;">发一条</button>
</div>
        <div class="moments-list" id="momentsList"></div>
    </div>

    <!-- 设置页 -->
    <div class="page" id="page-settings">
        <div class="settings-page">
            <div class="settings-section">
                <h4>🔑 API Key</h4>
                <input id="apiKeyInput" placeholder="填写你的Kimi API Key">
                <button onclick="saveApiKey()">保存API Key</button>
            </div>

            <div class="settings-section">
                <h4>🔧 自定义API</h4>
                <input id="apiUrlInput" placeholder="API地址">
                <input id="apiModelInput" placeholder="模型名">
                <button onclick="saveApiConfig()">保存API配置</button>
            </div>

            <div class="settings-section">
                <h4>🎭 角色设定</h4>
                <textarea id="systemPromptInput" placeholder="粘贴角色人设"></textarea>
                <button onclick="saveSystemPrompt()">保存角色设定</button>
            </div>

            <div class="settings-section">
                <h4>✏️ 修改名字</h4>
                <input id="aiNameInput" placeholder="AI的名字">
                <button onclick="changeAIName()">保存AI名字</button>
                <input id="userNameInput" placeholder="你的名字">
                <button onclick="changeUserName()">保存我的名字</button>
            </div>

            <div class="settings-section">
                <h4>👋 拍一拍后缀</h4>
                <input id="pokeAISuffixInput" placeholder="你拍他的后缀">
                <button onclick="setPokeAISuffix()">保存你拍他的后缀</button>
                <input id="pokeUserSuffixInput" placeholder="他拍你的后缀">
                <button onclick="setPokeUserSuffix()">保存他拍你的后缀</button>
            </div>

            <div class="settings-section">
                <h4>💬 会话管理</h4>
                <input id="chatIdInput" placeholder="会话编号，如1、2、3">
                <button onclick="switchChat()">切换会话</button>
                <button onclick="newChat()">新建会话</button>
            </div>

            <div class="settings-section">
                <h4>😊 AI表情包频率</h4>
                <input id="aiStickerRate" type="number" placeholder="0-1之间，如0.3">
                <button onclick="saveStickerRate()">保存频率</button>
            </div>

            <div class="settings-section">
                <h4>💬 主动发消息</h4>
                <input id="autoMsgRate" type="number" placeholder="间隔分钟，0为关闭">
                <button onclick="saveAutoMsgRate()">保存</button>
            </div>

            <div class="settings-section">
                <h4>🧠 手动总结</h4>
                <button onclick="summarizeChat()">总结前面的对话</button>
            </div>

            <div class="settings-section">
                <h4>📦 数据备份</h4>
                <button onclick="exportData()">导出数据</button>
                <button onclick="importData()">导入数据</button>
            </div>

            <div class="settings-section">
                <h4>🌙 夜间模式</h4>
                <button onclick="toggleNightMode()">切换夜间模式</button>
            </div>

            <div class="settings-section">
                <h4>🎨 自定义CSS</h4>
                <textarea id="cssEditor" placeholder="粘贴CSS代码..."></textarea>
                <button onclick="applyCSS()">应用</button>
                <button onclick="clearCSS()">清空</button>
            </div>

            <div class="settings-section">
                <h4>🖼️ 背景</h4>
                <button onclick="document.getElementById('bgInput').click()">上传自定义背景</button>
                <input type="file" id="bgInput" accept="image/*" style="display:none" onchange="uploadBg(event)">
                <button onclick="resetAll()">恢复默认</button>
                <button onclick="clearChat()">🗑️ 清空聊天记录</button>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="tabbar">
        <div class="tabbar-item active" onclick="switchTab('chat')">
            <div class="tab-icon">💬</div>
            <div>聊天</div>
        </div>
        <div class="tabbar-item" onclick="switchTab('moments')">
            <div class="tab-icon">🌍</div>
            <div>朋友圈</div>
        </div>
        <div class="tabbar-item" onclick="switchTab('settings')">
            <div class="tab-icon">⚙️</div>
            <div>设置</div>
        </div>
    </div>

</div>

<style id="customStyle"></style>

<script>
let API_KEY = localStorage.getItem('userApiKey') || '';
let systemPrompt = localStorage.getItem('systemPrompt') || '';
let API_URL = localStorage.getItem('apiUrl') || 'https://api.moonshot.cn/v1/chat/completions';
let API_MODEL = localStorage.getItem('apiModel') || 'kimi-k2.7-code';
let conversationHistory = [];
let aiAvatar = '🤖';
let userAvatar = '👤';
let aiName = 'AI 助手';
let userName = '我';
let pokeAISuffix = '的屁股';
let pokeUserSuffix = '的脸';
let aiStickerRate = parseFloat(localStorage.getItem('aiStickerRate') || '0.3');
let pendingSticker = null;
let autoMsgRate = parseInt(localStorage.getItem('autoMsgRate') || '0');
let autoMsgTimer = null;
let currentChatId = localStorage.getItem('currentChatId') || '1';
let moments = JSON.parse(localStorage.getItem('moments') || '[]');
function switchTab(tab) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tabbar-item').forEach(t => t.classList.remove('active'));
    document.getElementById('page-' + tab).classList.add('active');
    event.currentTarget.classList.add('active');
if (tab === 'moments') renderMoments();
}

function toggleStickerPanel() {}

function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (key) {
        API_KEY = key;
        localStorage.setItem('userApiKey', key);
        alert('API Key已保存');
    }
}

function saveApiConfig() {
    const url = document.getElementById('apiUrlInput').value.trim();
    const model = document.getElementById('apiModelInput').value.trim();
    if (url) { API_URL = url; localStorage.setItem('apiUrl', url); }
    if (model) { API_MODEL = model; localStorage.setItem('apiModel', model); }
    alert('API配置已保存');
}

function saveSystemPrompt() {
    const prompt = document.getElementById('systemPromptInput').value.trim();
    if (prompt) {
        systemPrompt = prompt;
        localStorage.setItem('systemPrompt', prompt);
        alert('角色设定已保存');
    }
}

function saveStickerRate() {
    const rate = document.getElementById('aiStickerRate').value;
    aiStickerRate = parseFloat(rate) || 0;
    localStorage.setItem('aiStickerRate', aiStickerRate);
    alert('表情频率已保存');
}

function saveAutoMsgRate() {
    const minutes = parseInt(document.getElementById('autoMsgRate').value) || 0;
    autoMsgRate = minutes * 60000;
    localStorage.setItem('autoMsgRate', autoMsgRate);
    startAutoMessage();
}

function startAutoMessage() {
    clearInterval(autoMsgTimer);
    if (autoMsgRate <= 0) return;
    autoMsgTimer = setInterval(function() {
        const lastTime = localStorage.getItem('lastMsgTime');
        const now = Date.now();
        if (lastTime) {
            const minutes = Math.floor((now - parseInt(lastTime)) / 60000);
            if (minutes > 5) {
                conversationHistory.push({ role: 'system', content: '（距离上次聊天已经过了' + minutes + '分钟，对方一直没理你）' });
            }
        }
        sendMessage(true);
    }, autoMsgRate);
}

function switchChat() {
    const id = document.getElementById('chatIdInput').value.trim();
    if (!id) return;
    currentChatId = id;
    localStorage.setItem('currentChatId', id);
    location.reload();
}

function newChat() {
    const id = Date.now().toString();
    currentChatId = id;
    localStorage.setItem('currentChatId', id);
    location.reload();
}

function saveHistory() {
    localStorage.setItem('chatHistory_' + currentChatId, JSON.stringify(conversationHistory));
    localStorage.setItem('chatMessages_' + currentChatId, document.getElementById('messages').innerHTML);
    localStorage.setItem('currentChatId', currentChatId);
}

function loadHistory() {
    const savedHistory = localStorage.getItem('chatHistory_' + currentChatId);
    const savedMessages = localStorage.getItem('chatMessages_' + currentChatId);
    if (!savedHistory && localStorage.getItem('chatHistory')) {
        localStorage.setItem('chatHistory_' + currentChatId, localStorage.getItem('chatHistory'));
        localStorage.setItem('chatMessages_' + currentChatId, localStorage.getItem('chatMessages'));
    }
    if (savedHistory) conversationHistory = JSON.parse(savedHistory);
    if (savedMessages) {
        document.getElementById('messages').innerHTML = savedMessages;
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        addDeleteEvents();
    }
}

function clearChat() {
    conversationHistory = [];
    document.getElementById('messages').innerHTML = `<div class="message ai"><div class="message-avatar">${aiAvatar}</div><div class="message-content">对话已清空</div><div class="message-time">00:00</div></div>`;
    saveHistory();
}

function addDeleteEvents() {
    document.querySelectorAll('#messages .message').forEach(msg => {
        if (msg.dataset.hasEvent) return;
        msg.dataset.hasEvent = '1';
        msg.addEventListener('contextmenu', e => { e.preventDefault(); showMessageMenu(msg); });
        let t;
        msg.addEventListener('touchstart', e => { t = setTimeout(() => showMessageMenu(msg), 500); });
        msg.addEventListener('touchend', () => clearTimeout(t));
        msg.addEventListener('touchmove', () => clearTimeout(t));
    });
}

function showMessageMenu(msg) {
    document.querySelectorAll('.msg-menu').forEach(m => m.remove());
    const menu = document.createElement('div');
    menu.className = 'msg-menu';
    menu.style.cssText = 'position:absolute;top:-10px;right:10px;background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.15);z-index:50;display:flex;overflow:hidden;';
    menu.innerHTML = '<div style="padding:8px 14px;font-size:13px;cursor:pointer;" onclick="copyMessage(this)">复制</div><div style="padding:8px 14px;font-size:13px;cursor:pointer;" onclick="quoteMessage(this)">引用</div><div style="padding:8px 14px;font-size:13px;cursor:pointer;" onclick="recallMessage(this)">撤回</div><div style="padding:8px 14px;font-size:13px;color:#e53935;cursor:pointer;" onclick="deleteMessage(this)">删除</div>';
    msg.appendChild(menu);
}

function copyMessage(el) {
    const msg = el.closest('.message');
    navigator.clipboard.writeText(msg.querySelector('.message-content').textContent).then(() => alert('已复制'));
    el.closest('.msg-menu').remove();
}

function quoteMessage(el) {
    const input = document.getElementById('userInput');
    if (input.dataset.quote) {
        delete input.dataset.quote;
        input.placeholder = '输入消息...';
    } else {
        const text = el.closest('.message').querySelector('.message-content').textContent;
        input.dataset.quote = text;
        input.value = '';
        input.placeholder = '回复：' + text;
        input.focus();
    }
    el.closest('.msg-menu').remove();
}

function recallMessage(el) {
    const msg = el.closest('.message');
    const text = msg.querySelector('.message-content') ? msg.querySelector('.message-content').textContent : '';
    if (text) {
        const index = conversationHistory.findIndex(item => item.content === text && item.role === 'user');
        if (index !== -1) conversationHistory.splice(index, 1);
    }
    msg.remove();
    saveHistory();
    el.closest('.msg-menu').remove();
}

function deleteMessage(el) {
    const msg = el.closest('.message');
    if (confirm('删除这条消息？')) { msg.remove(); saveHistory(); }
    el.closest('.msg-menu').remove();
}

function getTime() {
    const n = new Date();
    return n.getHours().toString().padStart(2, '0') + ':' + n.getMinutes().toString().padStart(2, '0');
}

function addMessage(text, type, quoteText) {
    const messagesDiv = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message ' + type;
    const av = document.createElement('div');
    av.className = 'message-avatar';
    const src = type === 'user' ? userAvatar : aiAvatar;
    if (src.startsWith('data:image')) av.innerHTML = `<img src="${src}">`;
    else av.textContent = src;
    const content = document.createElement('div');
    content.className = 'message-content';
    if (quoteText) {
        const q = document.createElement('div');
        q.style.cssText = 'background:rgba(0,0,0,0.06);border-left:3px solid rgba(0,0,0,0.2);padding:6px 10px;border-radius:6px;font-size:12px;margin-bottom:6px;';
        q.textContent = quoteText;
        content.appendChild(q);
    }
    const r = document.createElement('div');
    r.textContent = text;
    content.appendChild(r);
    const time = document.createElement('div');
    time.className = 'message-time';
    time.textContent = getTime();
    div.appendChild(av);
    div.appendChild(content);
    div.appendChild(time);
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    saveHistory();
    addDeleteEvents();
}

function addVoiceMessage(text, type) {
    addMessage('【语音 ' + Math.max(1, Math.round(text.length / 4)) + '″】' + text, type);
}

function addPokeMessage(text) {
    const div = document.createElement('div');
    div.style.cssText = 'text-align:center;font-size:11px;color:#999;padding:4px 0;';
    div.textContent = text;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    saveHistory();
    conversationHistory.push({ role: 'user', content: '我拍了拍你' });
}

function sendRedPacket() {
    const amount = prompt('红包金额：', '8.88');
    if (!amount) return;
    const div = document.createElement('div');
    div.className = 'message user';
    div.innerHTML = '<div class="message-avatar">' + (userAvatar.startsWith('data:image') ? '<img src="' + userAvatar + '">' : userAvatar) + '</div><div class="message-content" style="background:#f45b5b;color:#fff;">🧧 恭喜发财 ¥' + amount + '</div><div class="message-time">' + getTime() + '</div>';
    document.getElementById('messages').appendChild(div);
    conversationHistory.push({ role: 'user', content: '我给你发了一个' + amount + '元的红包' });
    saveHistory();
}

function sendTransfer() {
    const amount = prompt('转账金额：', '100.00');
    if (!amount) return;
    const div = document.createElement('div');
    div.className = 'message user';

    document.getElementById('messages').appendChild(div);
    conversationHistory.push({ role: 'user', content: '我给你转账' + amount + '元' });
    saveHistory();
}

function uploadBg(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxSize = 800;
            let width = img.width, height = img.height;
            if (width > maxSize || height > maxSize) {
                if (width > height) { height = Math.round(height * (maxSize / width)); width = maxSize; }
                else { width = Math.round(width * (maxSize / height)); height = maxSize; }
            }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL('image/jpeg', 0.6);
            document.body.style.background = 'url(' + compressed + ')';
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            localStorage.setItem('chatBg', compressed);
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function resetAll() {
    if (confirm('确定恢复默认？会清空所有数据')) {
        localStorage.clear();
        location.reload();
    }
}

function exportData() {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        data[key] = localStorage.getItem(key);
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'chat-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const data = JSON.parse(ev.target.result);
                Object.keys(data).forEach(key => localStorage.setItem(key, data[key]));
                alert('导入成功');
                location.reload();
            } catch(err) { alert('导入失败'); }
        };
        reader.readAsText(file);
    };
    input.click();
}

async function summarizeChat() {
    if (conversationHistory.length < 6) { alert('消息太少'); return; }
    const toSummarize = conversationHistory.slice(0, -4);
    const recent = conversationHistory.slice(-4);
    const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
        body: JSON.stringify({
            model: API_MODEL,
            messages: [{ role: 'system', content: '用一两句话总结以下对话，只输出总结。' }, ...toSummarize],
            temperature: 1, max_tokens: 500
        })
    });
    const data = await response.json();
    if (data.choices && data.choices[0]) {
        const summary = data.choices[0].message.content.trim();
        conversationHistory = [{ role: 'system', content: '之前的对话总结：' + summary }, ...recent];
        saveHistory();
        alert('总结完成');
    }
}

function showTyping() {
    const messagesDiv = document.getElementById('messages');

    const avatarHtml = aiAvatar.startsWith('data:image') ? `<img src="${aiAvatar}">` : aiAvatar;

    messagesDiv.appendChild(typingDiv);

}

function hideTyping(id) {
    const el = document.getElementById(id);

}

async function sendMessage(fromSticker) {
    if (!API_KEY) { alert('请先在设置里填写API Key'); return; }
    const input = document.getElementById('userInput');
    const message = input.value.trim();
    if (!message && !fromSticker && !pendingSticker) return;

    const lastTime = localStorage.getItem('lastMsgTime');
    const now = Date.now();
    if (lastTime) {
        const minutes = Math.floor((now - parseInt(lastTime)) / 60000);
        if (minutes > 5) {
            conversationHistory.push({ role: 'system', content: '（距离上次聊天已经过了' + minutes + '分钟）' });
        }
    }
    localStorage.setItem('lastMsgTime', now);

    if (message) {
        addMessage(message, 'user');
        conversationHistory.push({ role: 'user', content: message });
    }
    input.value = '';
    saveHistory();

    const typingId = showTyping();

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
            body: JSON.stringify({
                model: API_MODEL,
                messages: [
                    { role: 'system', content: '你想给对方转钱或发红包时，直接说“给你转账520”或“给你发红包13.14”，必须带金额。每次回复多换行，一句话一行。' },
                    { role: 'system', content: systemPrompt || '你是聊天助手' },
                    ...conversationHistory
                ],
                temperature: 1, max_tokens: 2000
            })
        });

        const data = await response.json();
        hideTyping(typingId);

        if (data.choices && data.choices[0]) {
            const reply = data.choices[0].message.content;
            conversationHistory.push({ role: 'assistant', content: reply });
            saveHistory();
            const lines = reply.split(/\n/).map(s => s.trim()).filter(s => s.length > 0);
            for (let i = 0; i < lines.length; i++) {
                await new Promise(resolve => setTimeout(resolve, i === 0 ? 0 : 600));
                addMessage(lines[i], 'ai');
            }
        } else {
            addMessage('出错了：' + JSON.stringify(data), 'ai');
        }
    } catch (error) {
        hideTyping(typingId);
        addMessage('网络错误：' + error.message, 'ai');
    }
}
function saveMoments() {
    localStorage.setItem('moments', JSON.stringify(moments));
}

function renderMoments() {
    const list = document.getElementById('momentsList');
    if (!list) return;
    list.innerHTML = '';
    if (moments.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:#999;padding:40px 0;font-size:13px;">还没有动态</div>';
        return;
    }
    moments.slice().reverse().forEach(function(m, idx) {
        const item = document.createElement('div');
        item.className = 'moment-item';
        item.innerHTML = `
            <div class="moment-head">
                <div class="moment-avatar">${aiAvatar.startsWith('data:image') ? '<img src="' + aiAvatar + '">' : aiAvatar}</div>
                <div>
                    <div class="moment-name">${aiName}</div>
                    <div class="moment-time">${m.time}</div>
                </div>
            </div>
            <div class="moment-text">${m.text}</div>
            <div class="moment-actions">
                <span onclick="likeMoment(${moments.length - 1 - idx})">${m.liked ? '❤️ 已赞' : '🤍 点赞'}</span>
                <span onclick="commentMoment(${moments.length - 1 - idx})">💬 评论</span>
            </div>
            ${m.comments && m.comments.length ? '<div style="margin-top:8px;font-size:12px;color:#666;">' + m.comments.map(c => '· ' + c).join('<br>') + '</div>' : ''}
        `;
        list.appendChild(item);
    });
}

function likeMoment(index) {
    moments[index].liked = !moments[index].liked;
    saveMoments();
    renderMoments();
}

function commentMoment(index) {
    const comment = prompt('评论：');
    if (!comment) return;
    if (!moments[index].comments) moments[index].comments = [];
    moments[index].comments.push('我：' + comment);
    saveMoments();
    renderMoments();
    conversationHistory.push({ role: 'user', content: '我评论了你的朋友圈：“' + comment + '”' });
}

async function generateMoment() {
    if (!API_KEY) { alert('请先填API Key'); return; }
    const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
        body: JSON.stringify({
            model: API_MODEL,
            messages: [
                { role: 'system', content: systemPrompt || '你是聊天助手' },
                { role: 'system', content: '帮我发一条朋友圈动态，一句话，不要带引号，不要解释。' },
                ...conversationHistory.slice(-10)
            ],
            temperature: 1, max_tokens: 200
        })
    });
    const data = await response.json();
    if (data.choices && data.choices[0]) {
        const text = data.choices[0].message.content.trim();
        moments.push({ text: text, time: new Date().toLocaleString(), liked: false, comments: [] });
        saveMoments();
        renderMoments();
    }
}
