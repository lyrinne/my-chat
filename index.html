<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的AI助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .header-info h1 { font-size: 18px; font-weight: 600; }
        .header-info p { font-size: 12px; opacity: 0.8; }

        .settings-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        .settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 100;
            display: none;
            width: 340px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .settings-panel.show { display: block; animation: slideDown 0.3s ease; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-panel h3 { font-size: 16px; margin-bottom: 16px; color: #333; }
        .settings-section { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #eee; }
        .settings-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .settings-section h4 { font-size: 14px; color: #666; margin-bottom: 10px; }

        .name-input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            margin-bottom: 8px;
        }

        .name-btn {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .css-editor {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: vertical;
            outline: none;
            background: #f8f9fa;
        }

        .css-actions { display: flex; gap: 8px; margin-top: 8px; }
        .css-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .apply-btn { background: #667eea; color: white; }
        .clear-btn { background: #f5f5f5; color: #666; }

        .upload-btn {
            width: 100%;
            padding: 10px;
            background: #f5f5f5;
            border: 2px dashed #ddd;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 8px;
        }

        .reset-btn {
            width: 100%;
            padding: 10px;
            background: #f5f5f5;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: #666;
            font-size: 13px;
            margin-top: 8px;
        }

        .bg-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .bg-option { width: 100%; height: 50px; border-radius: 12px; cursor: pointer; border: 3px solid transparent; position: relative; overflow: hidden; }
        .bg-option span { position: absolute; bottom: 3px; left: 5px; font-size: 9px; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

        .avatar-options { display: flex; gap: 8px; flex-wrap: wrap; }
        .avatar-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #f5f5f5;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: transparent;
        }

        .message {
            display: flex;
            gap: 8px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
            align-items: flex-end;
            min-width: 0;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .message-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .message-content {
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            max-width: 100%;
            min-width: 0;
        }

        .message.ai .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-top-left-radius: 4px;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-top-right-radius: 4px;
        }

        .message-time { font-size: 10px; color: #999; flex-shrink: 0; margin: 0 2px; }
        .message.user .message-time { order: -1; }

        .message-sticker { padding: 5px !important; background: transparent !important; border: none !important; }
        .message-sticker img { width: 100px; height: 100px; object-fit: contain; display: block; }

        .red-packet {
            background: #f45b5b !important;
            color: #fff !important;
            border: none !important;
            padding: 8px 16px !important;
            width: 200px !important;
            max-width: 200px !important;
            text-align: center !important;
            border-radius: 10px !important;
            display: block !important;
        }
        .red-packet .packet-title { font-size: 12px !important; }
        .red-packet .packet-amount { font-size: 16px !important; font-weight: 600 !important; margin: 2px 0 !important; }
        .red-packet .packet-note { display: none !important; }

        .transfer-card {
            background: #fff !important;
            border: 1px solid #e8e8e8 !important;
            color: #333 !important;
            padding: 8px 16px !important;
            width: 200px !important;
            max-width: 200px !important;
            text-align: center !important;
            border-radius: 10px !important;
            display: block !important;
        }
        .transfer-card .transfer-icon { font-size: 15px !important; display: block !important; }
        .transfer-card .transfer-amount { font-size: 16px !important; font-weight: 600 !important; }
        .transfer-card .transfer-status { font-size: 10px !important; color: #999 !important; margin-top: 2px !important; }

        .sticker-panel {
            display: none;
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-height: 200px;
            overflow-y: auto;
        }
        .sticker-panel.show { display: flex; }

        .sticker-item { font-size: 40px; cursor: pointer; transition: all 0.2s; padding: 5px; position: relative; }
        .sticker-item:hover { transform: scale(1.2); }
        .sticker-item img { width: 50px; height: 50px; object-fit: contain; border-radius: 8px; }

        .sticker-item .delete-btn {
            position: absolute;
            top: -5px; right: -5px;
            width: 18px; height: 18px;
            background: #ff4444;
            color: white;
            border-radius: 50%;
            font-size: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .sticker-item:hover .delete-btn { display: flex; }

        .toolbar {
            display: flex;
            gap: 8px;
            padding: 8px 24px;
            background: white;
            border-top: 1px solid #eee;
        }

        .toolbar-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 20px;
            border-radius: 50%;
        }

        .input-area {
            padding: 0 24px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
        }

        .input-area button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; }
        .typing-dot { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: typing 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

        .poke-message { text-align: center; font-size: 11px; color: #999; padding: 4px 0; }

        .msg-menu {
            position: absolute;
            top: -10px;
            right: 10px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            z-index: 50;
            display: flex;
            overflow: hidden;
        }
        .msg-menu-item { padding: 8px 14px; font-size: 13px; color: #333; cursor: pointer; white-space: nowrap; }
        .msg-menu-item:active { background: #f0f0f0; }
        .msg-menu-del { color: #e53935; }

        .quote-block {
            background: rgba(0,0,0,0.06);
            border-left: 3px solid rgba(0,0,0,0.2);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .voice-bubble {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            padding: 2px 0;
            cursor: pointer;
            min-width: 70px;
        }
        .voice-bubble .voice-duration { font-size: 12px; color: #888; }
        .voice-bubble .voice-text { display: none; font-size: 13px; color: inherit; margin-top: 4px; }
        .voice-bubble.open .voice-text { display: block; }

        @media (max-width: 600px) {
            .container { width: 100%; height: 100vh; border-radius: 0; }
            .message { max-width: 90%; }
        }
.call-float {
    position: fixed;
    top: 20px;
    left: 20px;
    right: 20px;
    background: rgba(0,0,0,0.85);
    color: white;
    border-radius: 14px;
    padding: 12px 16px;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

.call-float .call-float-text {
    flex: 1;
}

.call-float .call-float-end {
    background: #e53935;
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
}

.call-invite {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.call-invite-box {
    background: white;
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    width: 260px;
}

.call-invite-box .call-invite-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
}

.call-invite-box .call-invite-btns {
    display: flex;
    gap: 20px;
    justify-content: center;
}

.call-invite-box .call-invite-accept {
    background: #4caf50;
    color: white;
    border: none;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
}

.call-invite-box .call-invite-reject {
    background: #e53935;
    color: white;
    border: none;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
}
body.night-mode .container {
    background: #111 !important;
}

body.night-mode .header {
    background: #1a1a1a !important;
}

body.night-mode .input-area,
body.night-mode .toolbar,
body.night-mode .sticker-panel,
body.night-mode .settings-panel {
    background: #1a1a1a !important;
    color: #eee !important;
}

body.night-mode .input-area input {
    background: #222 !important;
    color: #eee !important;
    border-color: #333 !important;
}
.input-area textarea {
    flex: 1;
    padding: 12px 18px;
    border: 2px solid #e0e0e0;
    border-radius: 25px;
    font-size: 14px;
    outline: none;
    resize: none;
    font-family: inherit;
    line-height: 1.5;
    max-height: 120px;
    background: #fff;
    color: #333;
}

.input-area textarea:focus {
    border-color: #667eea;
}
.message-sticker {
    padding: 0 !important;
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
}

.message-sticker img {
    width: 100px;
    height: 100px;
    object-fit: contain;
    display: block;
}
.typing-status {
    font-size: 12px;
    color: #999;
    padding: 4px 12px;
    text-align: left;
}
 </style>
    <style id="customStyle"></style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar" id="headerAvatar">🤖</div>
            <div class="header-info">
                <h1 id="headerName">AI 助手</h1>
                <p>● 在线</p>
            </div>
            <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
        </div>

        <div class="settings-panel" id="settingsPanel">
            <h3>个性化设置</h3>
<div class="settings-section">
    <h4>🔑 API Key</h4>
    <input class="name-input" id="apiKeyInput" placeholder="填写你的Kimi API Key">
    <button class="name-btn" onclick="saveApiKey()">保存API Key</button>
</div>
<div class="settings-section">
    <h4>🔧 自定义API</h4>
    <input class="name-input" id="apiUrlInput" placeholder="API地址，如 https://api.moonshot.cn/v1/chat/completions">
    <input class="name-input" id="apiModelInput" placeholder="模型名，如 kimi-k2.7-code">
    <button class="name-btn" onclick="saveApiConfig()">保存API配置</button>
</div>
<div class="settings-section">
    <h4>🎭 角色设定</h4>
    <textarea class="css-editor" id="systemPromptInput" placeholder="在这里粘贴角色人设"></textarea>
    <button class="name-btn" onclick="saveSystemPrompt()">保存角色设定</button>
</div>
<div class="settings-section">
    <h4>🧠 手动总结</h4>
    <button class="name-btn" onclick="summarizeChat()">总结前面的对话</button>
</div>
<div class="settings-section">
    <h4>💬 会话管理</h4>
    <input class="name-input" id="chatIdInput" placeholder="输入会话编号，如1、2、3">
    <button class="name-btn" onclick="switchChat()">切换会话</button>
    <button class="name-btn" onclick="newChat()">新建会话</button>
</div>
<div class="settings-section">
    <h4>💬 主动发消息</h4>
    <input class="name-input" id="autoMsgRate" type="number" placeholder="间隔分钟，0为关闭">
    <button class="name-btn" onclick="saveAutoMsgRate()">保存</button>
</div><div class="settings-section">
    <h4>📦 数据备份</h4>
    <button class="name-btn" onclick="exportData()">导出数据</button>
    <button class="name-btn" onclick="importData()">导入数据</button>
</div>
<div class="settings-section">
    <h4>😊 AI表情包频率</h4>
    <select id="aiStickerRate" class="name-input">
        <option value="0">关闭</option>
        <option value="0.1">低</option>
        <option value="0.3">中</option>
        <option value="0.6">高</option>
    </select>
    <button class="name-btn" onclick="saveStickerRate()">保存频率</button>
</div>
            <div class="settings-section">
                <h4>✏️ 修改名字</h4>
                <input class="name-input" id="aiNameInput" placeholder="AI的名字">
                <button class="name-btn" onclick="changeAIName()">保存AI名字</button>
                <input class="name-input" id="userNameInput" placeholder="你的名字">
                <button class="name-btn" onclick="changeUserName()">保存我的名字</button>
            </div>

            <div class="settings-section">
                <h4>👋 拍一拍后缀</h4>
                <input class="name-input" id="pokeAISuffixInput" placeholder="你拍他的后缀">
                <button class="name-btn" onclick="setPokeAISuffix()">保存你拍他的后缀</button>
                <input class="name-input" id="pokeUserSuffixInput" placeholder="他拍你的后缀">
                <button class="name-btn" onclick="setPokeUserSuffix()">保存他拍你的后缀</button>
            </div>

            <div class="settings-section">
                <h4>🌙 夜间模式</h4>
                <button class="name-btn" onclick="toggleNightMode()">切换夜间模式</button>
            </div>

            <div class="settings-section">
                <h4>🎨 自定义CSS</h4>
                <textarea class="css-editor" id="cssEditor" placeholder="粘贴CSS代码..."></textarea>
                <div class="css-actions">
                    <button class="css-btn apply-btn" onclick="applyCSS()">应用</button>
                    <button class="css-btn clear-btn" onclick="clearCSS()">清空</button>
                </div>
            </div>

            <div class="settings-section">
                <h4>🤖 AI 头像</h4>
                <div class="avatar-options">
                    <div class="avatar-option" onclick="changeAvatar('🤖')">🤖</div>
                    <div class="avatar-option" onclick="changeAvatar('🦊')">🦊</div>
                    <div class="avatar-option" onclick="changeAvatar('🐱')">🐱</div>
                    <div class="avatar-option" onclick="changeAvatar('🐶')">🐶</div>
                    <div class="avatar-option" onclick="changeAvatar('🐼')">🐼</div>
                    <div class="avatar-option" onclick="changeAvatar('🦄')">🦄</div>
                </div>
                <button class="upload-btn" onclick="document.getElementById('avatarInput').click()">📁 上传头像</button>
                <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
            </div>

            <div class="settings-section">
                <h4>👤 我的头像</h4>
                <div class="avatar-options">
                    <div class="avatar-option" onclick="changeUserAvatar('👤')">👤</div>
                    <div class="avatar-option" onclick="changeUserAvatar('😊')">😊</div>
                    <div class="avatar-option" onclick="changeUserAvatar('😎')">😎</div>
                    <div class="avatar-option" onclick="changeUserAvatar('🥰')">🥰</div>
                    <div class="avatar-option" onclick="changeUserAvatar('🤓')">🤓</div>
                    <div class="avatar-option" onclick="changeUserAvatar('🐻')">🐻</div>
                </div>
                <button class="upload-btn" onclick="document.getElementById('userAvatarInput').click()">📁 上传头像</button>
                <input type="file" id="userAvatarInput" accept="image/*" style="display:none" onchange="uploadUserAvatar(event)">
            </div>

            <div class="settings-section">
                <h4>🖼️ 背景</h4>
                <div class="bg-options">
                    <div class="bg-option" style="background: linear-gradient(135deg, #667eea, #764ba2);" onclick="changeBg('gradient1')"><span>紫色</span></div>
                    <div class="bg-option" style="background: linear-gradient(135deg, #f093fb, #f5576c);" onclick="changeBg('gradient2')"><span>粉色</span></div>
                    <div class="bg-option" style="background: linear-gradient(135deg, #4facfe, #00f2fe);" onclick="changeBg('gradient3')"><span>蓝色</span></div>
                    <div class="bg-option" style="background: linear-gradient(135deg, #43e97b, #38f9d7);" onclick="changeBg('gradient4')"><span>绿色</span></div>
                    <div class="bg-option" style="background: #1a1a2e;" onclick="changeBg('dark')"><span>暗夜</span></div>
                </div>
                <button class="upload-btn" onclick="document.getElementById('bgInput').click()">📁 上传自定义背景</button>
                <input type="file" id="bgInput" accept="image/*" style="display:none" onchange="uploadBg(event)">
                <button class="reset-btn" onclick="resetAll()">恢复默认</button>
                <button class="reset-btn" onclick="clearChat()">🗑️ 清空聊天记录</button>
            </div>
        </div>

        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const data = JSON.parse(ev.target.result);
                Object.keys(data).forEach(function(key) {
                    if (key !== 'exportedAt' && data[key]) {
                        localStorage.setItem(key, data[key]);
                    }
                });

                location.reload();

      function uploadStickers(event) {
    const files = event.target.files;
    const group = prompt('这个表情放在哪个分组？\n可选：开心 / 生气 / 卖萌 / 伤心 / 哭哭 / 想你 / 爱你 / 得意', '开心');
    const validGroup = ['开心','生气','卖萌','伤心','哭哭','想你','爱你','得意'].includes(group) ? group : '开心';

    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    const maxSize = 150;
                    let width = img.width;
                    let height = img.height;
                    if (width > maxSize || height > maxSize) {
                        if (width > height) {
                            height = Math.round(height * (maxSize / width));
                            width = maxSize;
                        } else {
                            width = Math.round(width * (maxSize / height));
                            height = maxSize;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    const compressed = canvas.toDataURL('image/jpeg', 0.5);
                    addCustomSticker(compressed, validGroup);
                    saveCustomStickers();
                } catch(err) {
                    alert('图片处理失败，换一张小图试试');
                }
            };
            img.onerror = function() {
                alert('图片读取失败');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
    event.target.value = '';
}

                gradient3: 'linear-gradient(135deg, #4facfe, #00f2fe)',

        function uploadBg(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > maxSize || height > maxSize) {
                        if (width > height) {
                            height = Math.round(height * (maxSize / width));
                            width = maxSize;
                        } else {
                            width = Math.round(width * (maxSize / height));
                            height = maxSize;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    const compressed = canvas.toDataURL('image/jpeg', 0.6);
                    document.body.style.background = 'url(' + compressed + ')';
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundPosition = 'center';
                    document.body.style.backgroundImage = 'url(' + compressed + ')';
                    localStorage.setItem('chatBg', compressed);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

let callTimer = null;
let callSeconds = 0;
let callActive = false;

function startCall(type) {
    if (callActive) return;

    const invite = document.createElement('div');
    invite.className = 'call-invite';
    invite.id = 'callInvite';
    invite.innerHTML = `
        <div class="call-invite-box">
            <div class="call-invite-name">正在呼叫${aiName}...</div>
            <div class="call-invite-btns">
                <button class="call-invite-reject" onclick="cancelCall()">挂断</button>
            </div>
        </div>
    `;
    document.body.appendChild(invite);

    const delay = 3 + Math.floor(Math.random() * 8);
    setTimeout(function() {
        const inviteEl = document.getElementById('callInvite');
        if (inviteEl) {
            inviteEl.remove();
            startCallFloat(type);
        }
    }, delay * 1000);
}

function cancelCall() {
    const inviteEl = document.getElementById('callInvite');
    if (inviteEl) inviteEl.remove();
}

function startCallFloat(type) {
    callActive = true;
    callSeconds = 0;

    const float = document.createElement('div');
    float.className = 'call-float';
    float.id = 'callFloat';
    float.innerHTML = `
        <div class="call-float-text">${type === 'voice' ? '☎️' : '📹'} ${aiName} 通话中 <span id="callTime">00:00</span></div>
        <button class="call-float-end" onclick="endCall()">挂断</button>
    `;
    document.body.appendChild(float);

    clearInterval(callTimer);
    callTimer = setInterval(function() {
        callSeconds++;
        const m = Math.floor(callSeconds / 60).toString().padStart(2, '0');
        const s = (callSeconds % 60).toString().padStart(2, '0');
        const timeEl = document.getElementById('callTime');
        if (timeEl) timeEl.textContent = m + ':' + s;
    }, 1000);
}

function endCall() {
    clearInterval(callTimer);
    callActive = false;
    const float = document.getElementById('callFloat');
    if (float) float.remove();
}

function incomingCall() {
    if (callActive) return;

    const invite = document.createElement('div');
    invite.className = 'call-invite';
    invite.id = 'incomingCall';
    invite.innerHTML = `
        <div class="call-invite-box">
            <div class="call-invite-name">${aiName} 邀请你语音通话</div>
            <div class="call-invite-btns">

                <button class="call-invite-reject" onclick="rejectIncomingCall()">挂断</button>
            </div>
        </div>
    `;
    document.body.appendChild(invite);
}

function acceptIncomingCall() {
    const invite = document.getElementById('incomingCall');
    if (invite) invite.remove();
    startCallFloat('voice');
}

function rejectIncomingCall() {
    const invite = document.getElementById('incomingCall');
    if (invite) invite.remove();
}
        async function summarizeChat() {
            if (conversationHistory.length < 6) {
                alert('消息太少，先聊一会儿再总结');
                return;
            }

            const toSummarize = conversationHistory.slice(0, -4);
            const recent = conversationHistory.slice(-4);

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: API_MODEL,
                    messages: [
                        { role: 'system', content: '用一两句话总结以下对话，不要回复用户，只输出总结。' },
                        ...toSummarize
                    ],
                    temperature: 1,
                    max_tokens: 500
                })
            });

            const data = await response.json();
            if (data.choices && data.choices[0]) {
                const summary = data.choices[0].message.content.trim();
                conversationHistory = [
                    { role: 'system', content: '之前的对话总结：' + summary },
                    ...recent
                ];
                saveHistory();
                alert('总结完成，继续聊吧');
            }
        }
